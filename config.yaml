version: 3.0

ports:
  go_static_server: 8081
  go_api: 8082

prompts:
  base_start_prompt: 'Ты должен на основе запроса пользователя написать промпт для изображения барана на АНГЛИЙСКОМ ЯЗЫКЕ.
  В твоём ответе ОБЯЗАТЕЛЬНО должно быть слово ram, если тебя просят написать промпт для кого-ещё, ты должен адаптировать его под барана, пример:
  запрос: "олень в лесу", твой промпт: "a ram with deer antlers in the forest".
  Ты должен добавить от себя 1 случайный признак для барана.
  Если в запросе есть мат, отклони его, пример промпта: `blue ram with dark moustache, cyberpunk, on a motorcycle, on the field`.'
  base_hybrid_prompt: 'Ты должен на основе запроса пользователя написать промпт для изображения барана на АНГЛИЙСКОМ ЯЗЫКЕ.
  В твоём ответе ОБЯЗАТЕЛЬНО должно быть слово ram, если тебя просят написать промпт для кого-ещё, ты должен адаптировать его под барана, пример:
  запрос: "олень в лесу", твой промпт: "a ram with deer antlers in the forest".
  Ты должен добавить 1 случайный признак от себя и 1 признак от других баранов пользователя.
  Если в запросе есть мат, отклони его, пример промпта: `blue ram with dark moustache, cyberpunk, on a motorcycle, on the field`.'
  base_image_prompt: "the ram in the foreground, "
  base_description_prompt: "Ты пишешь описание для изображений баранов. Ты должен выявить, есть ли на изображении баран
  (даже если он уродливый). Если да то напиши ОЧЕНЬ короткое описание для него, и фона, не больше 6 слов.
  Не описывай признаки, которые есть у всех баранов (белый, с большими рогами, с белыми рогами и подобные), описывай уникальные признаки для этого барана."

clicks:
  cps_limit: 20
  first_ram: 100
  daily_rams:
    - 200
    - 500

gemini:
  model: "gemini-3.1-flash-lite"
  rate_limit: 15
  max_image_prompt_tokens: 150
  max_description_tokens: 100
  proxy: false
  proxy_endpoint: "cheery-baklava-3e2f26.netlify.app"
  proxy_transport: "rest"

users:
  default_avatar: "/static/img/default-avatar.png"
  default_avatar_box:
    - [0.25, 0.14]
    - [0.75, 0.64]
  max_username_len: 24

generation:
  max_prompt_len: 50
  time_between_daily: 1200
  time_between_daily_another:
    - 10

image_generation:
  endpoint: "https://taprams-ai-worker.kalasmaks97.workers.dev/"
  image_side: 512

websocket:
  ping_period: 3
  pong_wait:   5

another:
  top_rams_count: 5